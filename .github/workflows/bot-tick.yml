# يوقظ خدمة البوت المجانية ويشغّل دورة المهام (الأخبار، الأجندة، التنبيهات، التحيات، المجدول).
# GitHub يؤخّر المهام المجدولة أحياناً؛ للدقة استخدم cron-job.org كل 5 دقائق بنفس الطلب.
# أضف في Settings → Secrets and variables → Actions:
#   BOT_PUBLIC_URL (مثل https://qfx-bot.onrender.com) و BOT_API_KEY
name: Bot tick

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger tick
        env:
          BOT_PUBLIC_URL: ${{ secrets.BOT_PUBLIC_URL }}
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
        run: |
          if [ -z "$BOT_PUBLIC_URL" ] || [ -z "$BOT_API_KEY" ]; then
            echo "Secrets not configured yet — skipping."
            exit 0
          fi
          # الطلب الأول يوقظ الخدمة إن كانت نائمة
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$BOT_PUBLIC_URL/health"
          curl -fsS --retry 2 --retry-delay 10 --max-time 90 -X POST \
            -H "Authorization: Bearer $BOT_API_KEY" \
            "$BOT_PUBLIC_URL/api/jobs/tick"
