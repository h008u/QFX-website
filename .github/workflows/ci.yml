name: CI

on:
  push:
  pull_request:

# إلغاء التشغيل الأقدم على نفس الفرع عند دفع جديد
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (shared, bot, web)
        run: npm test
      - name: Build
        # الخطوط مستضافة ذاتياً — البناء لا يحتاج الوصول لخطوط Google
        run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + RLS tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: supabase/tests/run.sh
