name: CI

on:
  push:
  pull_request:

# إلغاء التشغيل الأقدم على نفس الفرع عند دفع جديد
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (shared, bot, web)
        run: npm test
      - name: Build
        # الخطوط مستضافة ذاتياً — البناء لا يحتاج الوصول لخطوط Google
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: E2E tests (web, demo mode)
        run: npm run e2e -w @qfx/web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Vercel build check (bot)
        # يتأكد أن دالة البوت تُبنى بنفس طريقة Vercel دون الحاجة لحساب أو نشر
        working-directory: apps/bot
        run: |
          mkdir -p .vercel
          echo '{"projectId":"ci","orgId":"ci","settings":{"framework":null}}' > .vercel/project.json
          npx --yes vercel@65 build --yes
          node --input-type=module -e "const m = await import('./.vercel/output/functions/api/index.func/apps/bot/api/index.js'); if (typeof m.POST !== 'function') process.exit(1)"

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + RLS tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: supabase/tests/run.sh
